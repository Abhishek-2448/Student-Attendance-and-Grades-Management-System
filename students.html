<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Students - Students Management System</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>

<body>

    <header>

        <h1>Students Management System</h1>

        <nav>

            <a href="index.html">Dashboard</a>

            <a href="students.html">Students</a>

            <a href="attendance.html">Attendance</a>

            <a href="grades.html">Grades</a>

            <span id="userRole"></span>

            <button onclick="logout()">Logout</button>

        </nav>

    </header>


    <main>

        <section class="student-management">

            <h2>Student Management</h2>


            <!-- Add Student -->

            <div class="student-form">

                <h3>Add Student</h3>

                <form id="studentForm">

                    <div class="form-group">

                        <label for="studentName">
                            Name
                        </label>

                        <input
                            type="text"
                            id="studentName"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="studentAge">
                            Age
                        </label>

                        <input
                            type="number"
                            id="studentAge"
                            min="1"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="studentGender">
                            Gender
                        </label>

                        <select
                            id="studentGender"
                            required
                        >

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="studentClass">
                            Class
                        </label>

                        <input
                            type="text"
                            id="studentClass"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="studentSection">
                            Section
                        </label>

                        <select
                            id="studentSection"
                            required
                        >

                            <option value="">
                                Select Section
                            </option>

                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="E">E</option>
                            <option value="F">F</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="studentEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="studentEmail"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="studentPhone">
                            Phone
                        </label>

                        <input
                            type="tel"
                            id="studentPhone"
                            required
                        >

                    </div>


                    <button type="submit">
                        Add Student
                    </button>

                </form>

            </div>


            <!-- Student Records -->

            <div class="student-records">

                <h3>Students</h3>

                <button
                    type="button"
                    id="exportStudents"
                    class="export-button"
                >
                    Export Students to Excel
                </button>


                <!-- Filters -->

                <div class="filter-container">

                    <div class="search-box">

                        <input
                            type="text"
                            id="searchStudent"
                            placeholder="Search student..."
                        >

                    </div>


                    <select id="filterClass">

                        <option value="">
                            All Classes
                        </option>

                    </select>


                    <select id="filterSection">

                        <option value="">
                            All Sections
                        </option>

                        <option value="A">Section A</option>
                        <option value="B">Section B</option>
                        <option value="C">Section C</option>
                        <option value="D">Section D</option>
                        <option value="E">Section E</option>
                        <option value="F">Section F</option>

                    </select>


                    <select id="filterGender">

                        <option value="">
                            All Genders
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                    </select>


                    <button
                        type="button"
                        id="clearStudentFilters"
                    >
                        Clear Filters
                    </button>

                </div>


                <!-- Student List -->

                <div class="student-list">

                    <div class="student-row header">

                        <span>Actions</span>

                        <span>ID</span>

                        <span>Name</span>

                        <span>Class</span>

                        <span>Section</span>

                        <span>Email</span>

                        <span>Phone</span>

                    </div>


                    <div id="studentList"></div>

                </div>

            </div>

        </section>

    </main>


    <script>

        if (
            localStorage.getItem("isLoggedIn")
            !== "true"
        ) {

            window.location.href =
                "login.html";

        }

    </script>


    <script src="js/students.js"></script>


    <script>

        document.getElementById(
            "userRole"
        ).textContent =
            localStorage.getItem("userRole");


        function logout() {

            localStorage.removeItem(
                "isLoggedIn"
            );

            localStorage.removeItem(
                "userRole"
            );

            window.location.href =
                "login.html";

        }

    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="js/students.js"></script>

</body>

</html>
